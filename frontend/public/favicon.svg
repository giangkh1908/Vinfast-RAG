<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100%" height="100%">
  <defs>
    <linearGradient id="vf_wing_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2575FC" />
      <stop offset="50%" stop-color="#1462D6" />
      <stop offset="100%" stop-color="#0B3C95" />
    </linearGradient>
    <linearGradient id="vf_inner_grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1462D6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <filter id="vf_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0B3C95" flood-opacity="0.3" />
    </filter>
  </defs>
  <g filter="url(#vf_glow)">
    <!-- Outer Wing of VinFast V -->
    <path d="M 92,10 C 76,12 63,28 50,60 C 42,40 33,26 8,10 C 24,19 36,36 50,66 C 64,36 76,19 92,10 Z" fill="url(#vf_wing_grad)" />
    <!-- Inner Accent Wing of VinFast V -->
    <path d="M 24,15 C 38,24 45,40 50,53 C 55,40 62,24 76,15 C 66,20 58,32 50,47 C 42,32 34,20 24,15 Z" fill="url(#vf_inner_grad)" />
  </g>
</svg>