services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: vivu_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

  postgres:
    image: postgres:16-alpine
    container_name: vivu_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: vivu
      POSTGRES_PASSWORD: vivu
      POSTGRES_DB: vivu
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@vivu.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  qdrant_storage:
  postgres_data: