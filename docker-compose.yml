services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vivu-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - vivu-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vivu-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vivu-network

networks:
  vivu-network:
    driver: bridge
