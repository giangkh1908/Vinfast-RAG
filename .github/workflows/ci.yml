name: ViVu Full-Stack CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ── 1. BACKEND CI ────────────────────────────────────────────────────────
  backend-ci:
    name: Backend Lint, Test & AI Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio httpx

      - name: Code Quality & Linting (Ruff Check & Format)
        run: |
          ruff check app/ tests/
          ruff format --check app/ tests/

      - name: Run Decision Log Schema Tests
        run: |
          python tests/test_log_schema.py

      - name: Run AI Quality & Zero-Hallucination Smoke Eval (AI CI Gate)
        env:
          CACHE_ENABLED: "false"
          ADMIN_API_KEY: "test-ci-admin-key"
        run: |
          python tests/test_ai_smoke_eval.py

  # ── 2. FRONTEND CI ───────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend Lint, TypeCheck & Vite Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Lint Frontend Code (oxlint)
        run: npm run lint

      - name: TypeCheck & Production Build (Vite + TypeScript)
        run: npm run build

  # ── 3. DOCKER BUILD VERIFICATION ──────────────────────────────────────────
  docker-build:
    name: Build & Verify Production Container
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry-run / Cache test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: vivu-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
