name: Vivu Backend CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-test:
    name: Lint, Test & Validate Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio httpx

      - name: Code Quality & Linting (Ruff)
        run: |
          ruff check app/ scripts/ tests/ --select E,F,W --ignore E501

      - name: Run Decision Log Schema Tests
        run: |
          python tests/test_log_schema.py


      - name: Run AI Quality & Zero-Hallucination Smoke Eval (AI CI Gate)
        env:
          CACHE_ENABLED: "false"
          ADMIN_API_KEY: "test-ci-admin-key"
        run: |
          python tests/test_ai_smoke_eval.py



  docker-build:
    name: Build & Verify Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry-run / Cache test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: vivu-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
